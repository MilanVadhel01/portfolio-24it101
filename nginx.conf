# ─────────────────────────────────────────────
# PRACTICAL 11 — Nginx configuration for the
# React single-page app (SPA).
#
# A SPA has only ONE real file: index.html.
# All routing happens in the browser (React Router),
# so a request like GET /projects does not exist on
# disk. Without fallback routing, refreshing
# http://localhost:5173/projects would return 404.
#
# try_files checks: is there a real file? if not, is
# there a directory? if not → serve index.html and
# let React Router handle the route in the browser.
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # Where the Vite production build (dist/) is copied to
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets for faster loading
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── SPA fallback routing ──────────────────
    # $uri        → try the exact file (/, /favicon.svg, ...)
    # $uri/       → try it as a directory
    # /index.html → final fallback: hand routing to React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (main-abc123.js) never change
    # between builds, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # NOTE: we deliberately do NOT declare a custom `types {}` block here.
    # A custom types block REPLACES nginx's default MIME table, which would
    # strip text/html from index.html and make browsers download the file
    # instead of rendering the app. The default mime.types already maps
    # .html, .js, .css, .json, .svg correctly.
}
